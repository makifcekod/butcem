<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bütçe Defteri</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--tx:#1b2330;--mu:#6b7686;--bd:#dde2ea;--ac:#1f3a5f;--g:#18794e;--r:#c0392b;--w:#d68910}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1a2029;--tx:#e8ecf2;--mu:#98a3b3;--bd:#2c3542;--ac:#6ea0e0;--g:#4cc38a;--r:#ff7b6b;--w:#f0b44c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
main{max-width:780px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 10px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,button{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;margin-top:12px;font-weight:600}
button.ghost{background:var(--bg);color:var(--tx);border:1px solid var(--bd);margin:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:13px}
.sum b{display:block;font-size:15px}.g{color:var(--g)}.r{color:var(--r)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}td.n,th.n{text-align:right}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{margin:0;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:#fff}
#msg{font-size:13px;margin-top:8px;min-height:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips span{font-size:12px;padding:3px 9px;border:1px solid var(--bd);border-radius:99px;cursor:pointer}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin:3px 0 10px}.bar i{display:block;height:100%}
.bl{display:flex;justify-content:space-between;font-size:13px}
.pie{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.pie .c{width:120px;height:120px;border-radius:50%}
.lg{font-size:12px;line-height:1.7}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.del{background:none;border:0;color:var(--mu);cursor:pointer;padding:0 4px;width:auto;margin:0}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<main>
<h1>💰 Bütçe Defteri</h1>

<details class="card" id="ayar">
  <summary>Ayarlar (bir kez girin)</summary>
  <label>Depo (kullanıcı/depo-adı)</label><input id="repo" placeholder="kullanici/butce">
  <label>Dal</label><input id="ref" value="main">
  <label>GitHub token (fine-grained: Actions=Read&amp;Write, Contents=Read)</label><input id="tok" type="password">
  <button id="kaydet">Kaydet</button>
  <div style="font-size:12px;color:var(--mu);margin-top:6px">Token yalnızca bu tarayıcıda (localStorage) saklanır.</div>
</details>

<div class="card">
  <h2>Yeni kayıt</h2>
  <div class="row">
    <div><label>Tarih</label><input id="tarih" type="date"></div>
    <div><label>Tür</label><select id="tur"><option value="gider">Gider</option><option value="gelir">Gelir</option></select></div>
  </div>
  <div class="row">
    <div><label>Kategori</label><input id="kat" list="kats" placeholder="Market, Maaş..."></div>
    <div><label>Tutar (TL)</label><input id="tutar" inputmode="decimal" placeholder="149,90"></div>
  </div>
  <datalist id="kats"></datalist><div class="chips" id="chips"></div>
  <label>Not</label><input id="not">
  <button id="ekle">Ekle</button>
  <div id="msg"></div>
</div>

<div class="card">
  <div class="tabs"><button data-p="gun">Gün</button><button data-p="ay" class="on">Ay</button><button data-p="yil">Yıl</button></div>
  <div class="row"><div><label>Dönem (2026-11-21 / 2026-11 / 2026)</label><input id="donem"></div><div><label>&nbsp;</label><button class="ghost" id="yenile">Yenile</button></div></div>
  <div class="sum" style="margin-top:12px">
    <div>Gelir<b class="g" id="sg">-</b></div><div>Gider<b class="r" id="sd">-</b></div><div>Net<b id="sn">-</b></div><div>Tasarruf<b id="st">-</b></div>
  </div>
</div>

<div class="card" id="bcard"><h2>Bütçe limitleri</h2><div id="budget"></div></div>
<div class="card" id="pcard"><h2>Gider dağılımı</h2><div class="pie"><div class="c" id="pie"></div><div class="lg" id="lg"></div></div></div>

<div class="card">
  <div class="scroll"><table id="tbl"></table></div>
  <button class="ghost" id="csv" style="margin-top:12px">CSV olarak indir</button>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const S={repo:'',ref:'main',tok:''};let rows=[],cfg={aylik_limitler:{},tasarruf_hedefi_orani:0,uyari_esikleri:[80,100]},per='ay';
try{Object.assign(S,JSON.parse(localStorage.getItem('butce')||'{}'))}catch(e){}
$('repo').value=S.repo;$('ref').value=S.ref;$('tok').value=S.tok;
if(!S.repo||!S.tok)$('ayar').open=true;
const today=new Date().toISOString().slice(0,10);$('tarih').value=today;
const PAL=['#1f3a5f','#2e86ab','#f6ae2d','#f26419','#55a630','#9b5de5','#e63946','#00b4d8','#8d99ae'];
const fmt=v=>v.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' TL';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hdr=(raw)=>({Authorization:'Bearer '+S.tok,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'});
const api=p=>`https://api.github.com/repos/${S.repo}/${p}`;
const sum=(a,t)=>a.filter(r=>r.t==t).reduce((s,r)=>s+r.a,0);

$('kaydet').onclick=()=>{S.repo=$('repo').value.trim();S.ref=$('ref').value.trim()||'main';S.tok=$('tok').value.trim();
  try{localStorage.setItem('butce',JSON.stringify(S))}catch(e){}$('ayar').open=false;load()};

function parseCSV(t){const out=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
    else if(c=='\n'){r.push(f);out.push(r);r=[];f=''}else if(c!='\r')f+=c}
  if(f||r.length){r.push(f);out.push(r)}return out}

async function load(){
  if(!S.repo||!S.tok)return;
  const q=`?ref=${S.ref}&t=${Date.now()}`;
  try{
    const res=await fetch(api('contents/data/transactions.csv'+q),{headers:hdr(true)});
    if(!res.ok)throw new Error(res.status);
    const p=parseCSV(await res.text()),h=p[0],ix=n=>h.indexOf(n);
    rows=p.slice(1).filter(r=>r.length>=4).map(r=>({id:r[ix('id')]||'',d:r[ix('tarih')],t:r[ix('tur')],k:r[ix('kategori')],a:parseFloat(r[ix('tutar')])||0,n:r[ix('not')]||''}));
  }catch(e){$('msg').textContent='Veri okunamadı: '+e.message;rows=[]}
  try{const c=await fetch(api('contents/data/config.json'+q),{headers:hdr(true)});if(c.ok)Object.assign(cfg,await c.json())}catch(e){}
  const cats=[...new Set([...rows.map(r=>r.k),...Object.keys(cfg.aylik_limitler)])];
  $('kats').innerHTML=cats.map(k=>`<option value="${esc(k)}">`).join('');
  $('chips').innerHTML=cats.slice(0,10).map(k=>`<span>${esc(k)}</span>`).join('');
  $('chips').querySelectorAll('span').forEach(s=>s.onclick=()=>$('kat').value=s.textContent);
  render();
}

function render(){
  const q=$('donem').value.trim(),f=rows.filter(r=>r.d.startsWith(q));
  const g=sum(f,'gelir'),d=sum(f,'gider');
  $('sg').textContent=fmt(g);$('sd').textContent=fmt(d);$('sn').textContent=fmt(g-d);
  $('st').textContent=g>0?'%'+((g-d)/g*100).toFixed(1).replace('.',','):'-';

  // bütçe çubukları (seçili dönemin ayı)
  const ay=q.slice(0,7),lim=cfg.aylik_limitler,ks=Object.keys(lim);
  $('bcard').style.display=ks.length&&q.length>=7?'':'none';
  $('budget').innerHTML=ks.map(k=>{
    const sp=rows.filter(r=>r.t=='gider'&&r.k==k&&r.d.startsWith(ay)).reduce((s,r)=>s+r.a,0),o=sp/lim[k]*100;
    const c=o>100?'var(--r)':o>=Math.min(...cfg.uyari_esikleri)?'var(--w)':'var(--g)';
    return `<div class="bl"><span>${esc(k)}</span><span>${fmt(sp)} / ${fmt(lim[k])} · %${o.toFixed(0)}</span></div><div class="bar"><i style="width:${Math.min(o,100)}%;background:${c}"></i></div>`}).join('');

  // pasta grafik
  const kat={};f.filter(r=>r.t=='gider').forEach(r=>kat[r.k]=(kat[r.k]||0)+r.a);
  const it=Object.entries(kat).sort((a,b)=>b[1]-a[1]);
  $('pcard').style.display=it.length?'':'none';
  let acc=0;const seg=it.map(([k,v],i)=>{const a=acc/d*360;acc+=v;return `${PAL[i%PAL.length]} ${a}deg ${acc/d*360}deg`});
  $('pie').style.background=`conic-gradient(${seg.join(',')||'transparent 0 0'})`;
  $('lg').innerHTML=it.map(([k,v],i)=>`<div><i style="background:${PAL[i%PAL.length]}"></i>${esc(k)} · ${fmt(v)} (%${(v/d*100).toFixed(0)})</div>`).join('');

  let h='';
  if(per=='yil'){
    h='<tr><th>Ay</th><th class="n">Gelir</th><th class="n">Gider</th><th class="n">Net</th></tr>';
    for(let m=1;m<=12;m++){const k=q+'-'+String(m).padStart(2,'0'),x=f.filter(r=>r.d.startsWith(k)),a=sum(x,'gelir'),b=sum(x,'gider');
      h+=`<tr><td>${k}</td><td class="n">${fmt(a)}</td><td class="n">${fmt(b)}</td><td class="n">${fmt(a-b)}</td></tr>`}
  }else{
    h='<tr><th>Tarih</th><th>Kategori</th><th>Not</th><th class="n">Tutar</th><th></th></tr>';
    [...f].sort((a,b)=>b.d.localeCompare(a.d)).forEach(r=>{
      h+=`<tr><td>${esc(r.d)}</td><td>${esc(r.k)}</td><td>${esc(r.n)}</td><td class="n ${r.t=='gelir'?'g':'r'}">${r.t=='gelir'?'+':'-'}${fmt(r.a)}</td>
      <td>${r.id?`<button class="del" data-id="${esc(r.id)}" title="Sil">🗑</button>`:''}</td></tr>`});
  }
  $('tbl').innerHTML=h;
  $('tbl').querySelectorAll('.del').forEach(b=>b.onclick=()=>sil(b.dataset.id));
}

async function sil(id){
  if(!confirm('Bu kayıt silinsin mi?'))return;
  const res=await fetch(api('actions/workflows/delete-entry.yml/dispatches'),{method:'POST',headers:hdr(),body:JSON.stringify({ref:S.ref,inputs:{id}})});
  if(res.status==204){rows=rows.filter(r=>r.id!=id);render();$('msg').textContent='✓ Silme isteği gönderildi.';setTimeout(load,25000)}
  else $('msg').textContent='Hata: '+res.status;
}

function setPer(p){per=p;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p==p));
  $('donem').value=p=='gun'?today:p=='ay'?today.slice(0,7):today.slice(0,4);render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setPer(b.dataset.p));
$('donem').oninput=render;$('yenile').onclick=load;setPer('ay');

$('csv').onclick=()=>{const q=$('donem').value.trim();
  const t='tarih,tur,kategori,tutar,not\n'+rows.filter(r=>r.d.startsWith(q)).map(r=>[r.d,r.t,r.k,r.a.toFixed(2),r.n].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=`butce-${q||'tum'}.csv`;a.click()};

$('ekle').onclick=async()=>{
  const m=$('msg');
  if(!S.repo||!S.tok){m.textContent='Önce ayarları girin.';return}
  const inputs={tarih:$('tarih').value,tur:$('tur').value,kategori:$('kat').value.trim()||'Diğer',
    tutar:$('tutar').value.trim().replace(',','.'),aciklama:$('not').value.trim()};
  if(!inputs.tarih||!(parseFloat(inputs.tutar)>0)){m.textContent='Tarih ve geçerli bir tutar girin.';return}
  m.textContent='Gönderiliyor...';
  const res=await fetch(api('actions/workflows/add-entry.yml/dispatches'),{method:'POST',headers:hdr(),body:JSON.stringify({ref:S.ref,inputs})});
  if(res.status==204){m.textContent='✓ Gönderildi. Kayıt ~20 sn içinde listeye düşer.';
    $('tutar').value='';$('not').value='';setTimeout(load,25000)}
  else m.textContent='Hata: '+res.status+' '+(await res.text());
};
load();
</script>
</body>
</html>
